
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا | الهيئة القومية للمياه</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
  <div id="site-header"></div>

  <main class="container">
    <section class="section">
      <h1>تواصل معنا</h1>
      <p>يمكنك إرسال استفسار أو شكوى من خلال النموذج التالي.</p>

      <form action="submit_contact.php" method="POST" class="form-card">
        <label for="contact_name">الاسم</label>
        <input type="text" id="contact_name" name="name"
               placeholder="أدخلي اسمك" required>

        <label for="contact_email">البريد الإلكتروني</label>
        <input type="email" id="contact_email" name="email"
               placeholder="example@email.com">

        <label for="contact_phone">رقم الهاتف</label>
        <input type="tel" id="contact_phone" name="phone"
               placeholder="أدخلي رقم الهاتف">

        <label for="message_type">نوع الرسالة</label>
        <select id="message_type" name="message_type" required>
          <option value="">اختاري نوع الرسالة</option>
          <option value="استفسار">استفسار</option>
          <option value="شكوى">شكوى</option>
          <option value="اقتراح">اقتراح</option>
        </select>

        <label for="message">الرسالة</label>
        <textarea id="message" name="message" rows="5"
                  placeholder="اكتبي رسالتك هنا" required></textarea>

        <button type="submit" class="primary-button">إرسال الرسالة</button>
      </form>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="script.js"></script>
</body>

</html>
