
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | الهيئة القومية للمياه</title>
    <link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body class="login-page">
    <main class="login-card">
        <div class="water-logo">💧</div>
      
        <h1>الهيئة القومية للمياه</h1>
        <p>مرحباً بك في منصتنا الإلكترونية</p>

<section class="hero">
    <div class="hero-content">
        <h1>سُقيا.. مياه نقية لحياة أفضل</h1>

        <p>
            نعمل على توفير مياه آمنة ونقية
            لجميع المواطنين.
        </p>

    </div>
</section>
        
<form id="loginForm">
    <label for="username">اسم المستخدم</label>
    <input
        id="username"
        name="username"
        type="text"
        placeholder="أدخلي اسم المستخدم"
        required
    >

    <label for="password">كلمة المرور</label>
    <input
        id="password"
        name="password"
        type="password"
        placeholder="أدخلي كلمة المرور"
        required
    >

    <button type="submit" class="primary-button">
        تسجيل الدخول
    </button>

<p class="register-text">
  ما عندك حساب؟
  <a href="#" id="showRegister">إنشاء حساب جديد</a>
</p>


    <p id="loginMessage"></p>
</form>
      
<div id="registerBox" class="register-box" hidden>
  <h2>إنشاء حساب جديد</h2>

  <form id="registerForm">
    <label for="newName">الاسم الكامل</label>
    <input type="text" id="newName" required>

    <label for="newUsername">اسم المستخدم</label>
    <input type="text" id="newUsername" required>

    <label for="newPassword">كلمة المرور</label>
    <input type="password" id="newPassword" required>

    <label for="confirmPassword">تأكيد كلمة المرور</label>
    <input type="password" id="confirmPassword" required>

    <button type="submit">إنشاء الحساب</button>
    <button type="button" id="backToLogin">العودة لتسجيل الدخول</button>
  </form>

  <p id="registerMessage"></p>
</div>


        <p class="login-footer">معاً من أجل مياه آمنة ومستدامة</p>
    </main>
  <script src="script.js"></script>
</body>
</html>
